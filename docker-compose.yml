# Optional: use this if you don't already run PostgreSQL locally.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: null_app
      POSTGRES_USER: null
      POSTGRES_PASSWORD: null_local_only
    ports:
      - "5432:5432"
    volumes:
      - null_pg:/var/lib/postgresql/data
volumes:
  null_pg:
